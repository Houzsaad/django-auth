<!DOCTYPE html>
<html>
<head>
    <title>Items</title>
</head>
    <body>
    <h1> Items List</h1>
    <ul>
        X=2
        Y=1
        {% for item in items %}
            <li>
                <h2>{{ item.name }}</h2>
                <p>{{ item.description }}</p>
                <p> price: ${{item.price}}</p>
                <p> Created: {{item.created_at}}</p>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
